<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สามก๊ก What If — ถ้าการบุกเหนือครั้งแรกของขงเบ้งสำเร็จ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <div id="where"></div>
  <button id="mapmode" title="สลับความเข้มของแผนที่พื้น">แผนที่: กลาง</button>
  <div id="hud"></div>
</div>

<div id="time">
  <div id="tstack">
    <div id="chapstrip"></div>
    <div id="track"></div>
  </div>
  <span id="counter">—</span>
</div>

<aside>
  <div class="head">
    <div id="nowchap"></div>
    <div id="nowyear"></div>
  </div>

  <!-- นิยายทั้งเรื่องอยู่ในนี้ เลื่อนอ่านต่อเนื่อง แผนที่วิ่งตามที่อ่าน -->
  <div class="body" id="reader"></div>

  <div class="hint">
    <b>เลื่อนอ่านได้เลย — แผนที่จะวิ่งตามเนื้อเรื่อง</b><br>
    ← → เลื่อนทีละตอน · Enter เข้าสมรภูมิ · ล้อเลื่อนซูมแผนที่ · Esc คืนมุมกล้อง
  </div>

  <div class="foot">
    <button id="btnPrev">◀ ย้อน</button>
    <button id="btnNext">ตอนต่อไป ▶</button>
    <button id="btnReset" title="คืนมุมกล้องทั้งแผ่นดิน">⤢</button>
  </div>

  <!-- DECISIONS §2 ล็อกไว้ว่าเครดิตแผนที่ต้องแสดงท้ายหน้าเสมอ — แผนที่พื้นเป็นงานของคนอื่น -->
  <div class="credit">
    แผนที่พื้น <a href="https://kongming.net/novel/maps/" target="_blank" rel="noopener noreferrer">kongming.net</a> โดย William L ·
    เนื้อเรื่องและการนำเสนอ Sakdipong
  </div>
</aside>

<!-- ══ โหมดสมรภูมิ — แผนที่ยุทธวิธี วาดเวกเตอร์ล้วน ไม่ใช้ภาพ (DECISIONS §5) ══ -->
<div id="battle" hidden>
  <div class="bwrap">
    <header class="bhead">
      <div>
        <h2 id="bTitle"></h2>
        <span id="bYear"></span>
      </div>
      <!-- คำว่า "กลับสู่แผนที่ใหญ่" ถูกซ่อนบนจอมือถือ เหลือแค่ ✕ ไม่งั้นปุ่มล้นออกนอกหัว -->
      <button id="bClose">✕<span class="blong"> กลับสู่แผนที่ใหญ่</span></button>
    </header>

    <div class="bmain">
      <svg id="bsvg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="bside">
        <div class="bsidehead">กำลังพลในสมรภูมิ</div>
        <div id="bRoster"></div>

        <div class="bsidehead" style="margin-top:6px">อ่านแผนที่</div>
        <div id="bTerrainKey"></div>

        <div class="blegend">
          <span><i class="bchip s-triangle"></i> ทหารม้า</span>
          <span><i class="bchip s-square"></i> ทหารราบ</span>
          <span><i class="bchip s-hex"></i> กองเรือ</span>
          <span><i class="bchip s-circle"></i> ป้อม/คลัง</span>
          <span><i class="bchip s-wagon"></i> ขบวนเสบียง</span>
        </div>
      </div>
    </div>

    <footer class="bfoot">
      <div id="bDots"></div>
      <div id="bPhaseNo"></div>
      <p id="bPhaseTxt"></p>
      <div class="bctrl">
        <button id="bPrev">◀ ย้อน</button>
        <button id="bPlay">▶ เล่นต่อเนื่อง</button>
        <button id="bNext">ระยะถัดไป ▶</button>
      </div>
    </footer>
  </div>
</div>

<!-- data ต้องมาก่อน engine เสมอ (DECISIONS กฎ 3 — ไม่มี fetch จะได้เปิดแบบ file:// ได้) -->
<script src="data/names.js"></script>
<script src="data/places.js"></script>
<script src="data/geo.js"></script>
<!-- รูปพื้นที่ที่ขยายจนไม่มีรูโหว่ สร้างจาก geo.js + ชายฝั่งจริง (tools/build_geo.js)
     ลบบรรทัดนี้ทิ้ง = กลับไปใช้รูปที่ลากด้วยมือใน geo.js ทันที -->
<script src="data/geo_fill.js"></script>
<script src="data/routes.js"></script>
<script src="data/timeline.js"></script>
<script src="data/battles/jieting228.js"></script>
<script src="data/battles/chencang229.js"></script>
<script src="data/battles/mei229.js"></script>
<script src="data/battles/twogates230.js"></script>
<script src="data/battles/wuguan244.js"></script>
<script src="data/battles/eastern255.js"></script>
<script src="data/battles/xiling272.js"></script>
<script src="data/battles/conquestwu276.js"></script>

<script src="js/labeler.js"></script>
<script src="js/engine.js"></script>
<script src="js/strategic.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script>
  TK.map.init(document.getElementById('stage'));
  TK.battle.bind();
  TK.ui.init();
</script>
</body>
</html>
